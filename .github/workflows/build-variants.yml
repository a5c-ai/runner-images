name: Build Image Variants

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node.js version'
        required: false
        default: '18.18.2'
      ruby_version:
        description: 'Ruby version'
        required: false
        default: '3.2.2'
      runner_version:
        description: 'GitHub Actions Runner version'
        required: false
        default: '2.310.2'
      runner_container_hooks_version:
        description: 'Runner Container Hooks version'
        required: false
        default: '0.3.2'
      docker_version:
        description: 'Docker version'
        required: false
        default: '23.0.6'
      image_tag:
        description: 'Custom image tag (optional)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-custom-variant:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          TAG_SUFFIX="node${{ github.event.inputs.node_version }}-ruby${{ github.event.inputs.ruby_version }}"
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            CUSTOM_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}"
            echo "tags=${CUSTOM_TAG}" >> $GITHUB_OUTPUT
          else
            DEFAULT_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_SUFFIX}"
            SHA_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG_SUFFIX}-${{ github.sha }}"
            echo "tags=${DEFAULT_TAG},${SHA_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUNNER_VERSION=${{ github.event.inputs.runner_version }}
            RUNNER_CONTAINER_HOOKS_VERSION=${{ github.event.inputs.runner_container_hooks_version }}
            DOCKER_VERSION=${{ github.event.inputs.docker_version }}
            NODE_VERSION=${{ github.event.inputs.node_version }}
            RUBY_VERSION=${{ github.event.inputs.ruby_version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
